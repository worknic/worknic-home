<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>규격으로 찾는 공구·부품 · WORKNIC</title><link rel="stylesheet" href="/parts/style.css?v=20261121-bulk2"><script type="module" src="/parts/app.js?v=20261121-bulk2"></script></head><body><header><a href="/">WORKNIC</a><a href="/assortment/">전체 취급 품목</a></header><main><p class="eyebrow">STANDARD PARTS</p><h1>맞는 규격을, 빠르게.</h1><p class="intro">기계부품부터 절삭공구까지. 제품군을 고르고 규격을 비교하세요.</p><nav id="families" aria-label="부품 카테고리"></nav><section><h2>사진·규격을 확인한 제품</h2><p>같은 제품군을 모았습니다. 규격별 상품코드와 문의를 각각 확인할 수 있습니다.</p><p id="status" role="status">공개된 제품을 불러오는 중입니다.</p><div id="groups"></div></section><aside>이미지는 제조사의 모델별 사진 또는 제품군 대표 이미지입니다. 사진 속 여러 방향의 모습은 판매 수량을 뜻하지 않습니다.<br>현재 가격·재고·판매 단위는 상품별 문의로 확인해 주세요.</aside></main><footer><a href="/contact/">워크닉 매장 문의</a></footer></body></html>
