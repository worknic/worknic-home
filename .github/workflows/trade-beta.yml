name: Trade beta checks
on:
  pull_request:
    paths: ['trade/**', 'render.yaml', '.github/workflows/trade-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trade/package-lock.json
      - run: npm ci
      - run: npm test
