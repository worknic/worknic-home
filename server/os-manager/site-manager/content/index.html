<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>상품 콘텐츠 관리 · WORKNIC OS</title><link rel="stylesheet" href="content.css"><script type="module" src="editor.js"></script></head><body><header><a href="../">WORKNIC OS · 홈페이지 관리</a><h1>상품 콘텐츠 관리</h1><p>상품코드로 썸네일·설명·규격을 관리합니다. 원본 가격·재고·상품명은 수정하지 않습니다.</p><p id="mode" role="status"></p></header><main><form id="search"><label for="query">상품명·모델·상품코드</label><div class="search"><input id="query" type="search" required><button>검색</button></div></form><p id="status" role="status" aria-live="polite"></p><div id="results"></div><section id="editor" hidden><h2 id="name"></h2><p id="original"></p><p id="revision"></p><form id="fields"><label>썸네일 원본 URL<input name="thumbnail" type="url" placeholder="https://..."></label><label>사진 대체텍스트<input name="alt" maxlength="240"></label><label>설명<textarea name="description" rows="4" maxlength="8000"></textarea></label><label>규격 · 한 줄에 항목명 | 값<textarea name="specs" rows="8" placeholder="전압 | 18 V"></textarea></label><label>출처 · 한 줄에 설명 | HTTPS 주소<textarea name="sources" rows="4"></textarea></label><label>자료 확인일<input name="checkedOn" type="date"></label><div class="actions"><button type="button" id="preview">콘텐츠 미리보기</button><button id="save">초안 저장</button><button type="button" id="reload">서버 원본 다시 불러오기</button></div></form><fieldset id="checks"><legend>저장한 최신 초안 검수</legend><label><input type="checkbox" name="identity"> 상품코드와 제품 일치</label><label><input type="checkbox" name="photos"> 사진과 사용 범위·대체텍스트 확인</label><label><input type="checkbox" name="specs"> 규격·단위·구성 확인</label><label><input type="checkbox" name="sources"> 출처와 확인일 확인</label></fieldset><div class="actions"><button id="review">검수 완료</button><button id="publish">검수본 발행</button><button id="unpublish">콘텐츠 발행 해제</button><button id="history">변경 이력</button></div><p id="message" role="status" aria-live="polite"></p><div id="history-list"></div></section></main><dialog id="preview-dialog"><button id="close-preview">닫기</button><h2>콘텐츠 미리보기</h2><p>현재 입력 내용입니다. 실제 상품 페이지 전체 미리보기와는 다릅니다.</p><div id="preview-body"></div></dialog></body></html>
