<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쉼표 멤버십 · WORKNIC</title><link rel="stylesheet" href="/assets/worknic.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="/">WORKNIC<i>,</i></a><nav class="menu"><a href="/about/">브랜드</a><a href="/letters/">쉼표, 수집</a><a href="/team/">팀과 연결</a></nav></div></header><main class="wrap"><section class="page-hero"><span class="eyebrow">COMMA MEMBERSHIP</span><h1>조금 더 오래<br>이어지는 방식.</h1><p>쉼표 멤버십은 혜택을 앞세우기보다, 매장과 작업의 시간을 함께 쌓아가는 관계를 생각합니다. 현재 운영 내용과 가입 안내는 실시간 문의로 확인해주세요.</p><br><a class="button" href="https://talk.naver.com/profile/w4qyth" target="_blank" rel="noopener">멤버십 문의하기 ↗</a></section><section class="section"><div class="columns"><article><span class="number">01</span><h3>먼저 듣습니다.</h3><p>필요한 작업과 관심사를 바탕으로 관계의 시작점을 만듭니다.</p></article><article><span class="number">02</span><h3>함께 경험합니다.</h3><p>클래스, 소식, 매장 안의 작은 순간을 함께 나눕니다.</p></article><article><span class="number">03</span><h3>오래 남깁니다.</h3><p>유행에 흔들리지 않는 선택이 생활에 남도록 돕습니다.</p></article></div></section></main></body></html>
